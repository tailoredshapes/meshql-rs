# A local stand-in for the Confluent Cloud endpoints the ksql adapter talks to.
#
# The adapter speaks Kafka REST v3 and the ksqlDB REST API. Confluent Cloud
# serves the Kafka REST paths under /kafka/v3; the open-source REST Proxy serves
# them under /v3, so `restshim` rewrites the prefix and the adapter runs
# unmodified against either.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["9092:9092"]

  kafka-rest:
    image: confluentinc/cp-kafka-rest:7.5.0
    depends_on: [kafka]
    environment:
      KAFKA_REST_HOST_NAME: kafka-rest
      KAFKA_REST_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_REST_LISTENERS: http://0.0.0.0:8082
    ports: ["8082:8082"]

  restshim:
    image: nginx:1.27-alpine
    depends_on: [kafka-rest]
    command: >
      sh -c "printf 'server {\n  listen 18083;\n  location /kafka/v3/ { proxy_pass http://kafka-rest:8082/v3/; }\n  location /v3/ { proxy_pass http://kafka-rest:8082/v3/; }\n}\n' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    ports: ["18083:18083"]

  ksqldb:
    image: confluentinc/ksqldb-server:0.29.0
    depends_on: [kafka]
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:29092
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_STREAMS_COMMIT_INTERVAL_MS: 100
      KSQL_KSQL_STREAMS_CACHE_MAX_BYTES_BUFFERING: 0
      KSQL_KSQL_STREAMS_AUTO_OFFSET_RESET: earliest
      KSQL_KSQL_QUERY_PULL_TABLE_SCAN_ENABLED: "true"
    ports: ["8088:8088"]
