[package]
name = "meshql-sqlite"
version = "0.1.0"
edition = "2021"
description = "meshql-sqlite — part of the meshql framework"
license = "MIT"
repository = "https://github.com/tailoredshapes/meshql-rs"

[dependencies]
meshql-core = { version = "0.1.0", path = "../meshql-core" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
handlebars = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }

[[bin]]
name = "perf_server"
path = "src/bin/perf_server.rs"
required-features = ["perf"]

[features]
perf = ["dep:meshql-server", "dep:anyhow"]

[dependencies.meshql-server]
version = "0.1.0"
path = "../meshql-server"
optional = true

[dependencies.anyhow]
version = "1"
optional = true

[dev-dependencies]
tokio = { workspace = true }
uuid = { workspace = true }
meshql-cert = { version = "0.1.0", path = "../meshql-cert" }
meshql-server = { version = "0.1.0", path = "../meshql-server" }
cucumber = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

[[test]]
name = "repo_cert"
harness = true

[[test]]
name = "searcher_cert"
harness = true

[[test]]
name = "farm_cert"
harness = false

[[test]]
name = "egg_economy_cert"
harness = false

[[test]]
name = "cross_service_cert"
harness = false

[[test]]
name = "authz_cert"
harness = false

[[test]]
name = "auth_plugin_cert"
harness = false
