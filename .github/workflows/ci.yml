name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned certification contract
        uses: ./.github/actions/checkout-contract
        with:
          path: meshql-cert/tests/features/contract
          ssh-key: ${{ secrets.CONTRACT_SSH_KEY }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Fetch the pinned private workspace dependency
        uses: ./.github/actions/merk-cloud
        with:
          ssh-key: ${{ secrets.MERK_CLOUD_SSH_KEY }}

      - name: Build
        run: cargo build --workspace

      - name: Required MCP surface certification (SQLite, real stdio)
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/test-mcplette.sh target/mcp-cert/results.json

      # meshql-dynamo certifies against DynamoDB Local rather than real AWS.
      # Unlike the testcontainers-backed adapters it does not start its own
      # container, because every cert needs the same endpoint and a per-test
      # container would be slower than the tests.
      - name: Start DynamoDB Local
        if: runner.os == 'Linux'
        run: |
          docker run -d --name dynamodb-local -p 8123:8000 amazon/dynamodb-local:latest
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null "http://localhost:8123"; then exit 0; fi
            sleep 1
          done
          echo "::error::DynamoDB Local did not become reachable on 8123"
          exit 1

      # meshql-ksql used to skip its own certification when no Confluent Cloud
      # cluster was configured, which exits 0 — so it reported success on every
      # machine that had never configured one, and hid two real defects. It now
      # fails instead, and this stack is what lets it pass honestly.
      - name: Start Kafka + ksqlDB
        if: runner.os == 'Linux'
        run: |
          eval "$(scripts/ksql-local.sh)"
          {
            echo "CONFLUENT_KAFKA_REST_URL=$CONFLUENT_KAFKA_REST_URL"
            echo "CONFLUENT_KAFKA_CLUSTER_ID=$CONFLUENT_KAFKA_CLUSTER_ID"
            echo "CONFLUENT_KAFKA_API_KEY=$CONFLUENT_KAFKA_API_KEY"
            echo "CONFLUENT_KAFKA_API_SECRET=$CONFLUENT_KAFKA_API_SECRET"
            echo "CONFLUENT_KSQLDB_URL=$CONFLUENT_KSQLDB_URL"
            echo "CONFLUENT_KSQLDB_API_KEY=$CONFLUENT_KSQLDB_API_KEY"
            echo "CONFLUENT_KSQLDB_API_SECRET=$CONFLUENT_KSQLDB_API_SECRET"
          } >> "$GITHUB_ENV"

      # Linux runners have a Docker daemon, so the testcontainers-backed DB
      # adapter certs (meshql-mongo / meshql-mysql / meshql-postgres) can run,
      # and so can meshql-dynamo's and meshql-ksql's.
      - name: Run tests (full suite)
        if: runner.os == 'Linux'
        env:
          MESHQL_DYNAMO_ENDPOINT: http://localhost:8123
        run: cargo test --workspace

      # macOS and Windows runners have no Docker daemon, so the certs that need a
      # container can't start one — meshql-ksql included, now that it certifies
      # against a real Kafka rather than skipping. Run everything else (which
      # still covers the sqlite and merkql adapters, meshql-merk's non-live
      # tests, and all pure-logic crates cross-platform). The farm example's
      # end-to-end tests also start MongoDB containers and stay in the Linux suite.
      - name: Run tests (excluding Docker-backed DB adapter certs)
        if: runner.os != 'Linux'
        run: cargo test --workspace --exclude meshql-mongo --exclude meshql-mysql --exclude meshql-postgres --exclude meshql-dynamo --exclude meshql-ksql --exclude farm

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned certification contract
        uses: ./.github/actions/checkout-contract
        with:
          path: meshql-cert/tests/features/contract
          ssh-key: ${{ secrets.CONTRACT_SSH_KEY }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Fetch the pinned private workspace dependency
        uses: ./.github/actions/merk-cloud
        with:
          ssh-key: ${{ secrets.MERK_CLOUD_SSH_KEY }}

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
