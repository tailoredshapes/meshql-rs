[package]
name = "meshql-mcp"
version = "0.1.0"
edition = "2021"
description = "meshql-mcp — Model Context Protocol server for meshql-rs deployments"
license = "MIT"
repository = "https://github.com/tailoredshapes/meshql-rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

async-graphql-parser = "7"
jsonschema = { version = "0.26", default-features = false }
percent-encoding = "2"
meshql-core = { path = "../meshql-core" }
meshql-config = { path = "../meshql-config" }
axum = { workspace = true, optional = true }
meshql-server = { path = "../meshql-server", optional = true }
meshql-sqlite = { path = "../meshql-sqlite", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"], optional = true }
chrono = { workspace = true, optional = true }

[features]
cert-fixture = ["dep:axum", "dep:meshql-server", "dep:meshql-sqlite", "dep:sqlx", "dep:chrono"]

[[bin]]
name = "mcp-cert-adapter"
path = "src/bin/mcp-cert-adapter.rs"
required-features = ["cert-fixture"]
