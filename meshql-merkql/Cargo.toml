[package]
name = "meshql-merkql"
version = "0.1.0"
edition = "2021"
description = "meshql-merkql — part of the meshql framework"
license = "MIT"
repository = "https://github.com/tailoredshapes/meshql-rs"

[dependencies]
meshql-core = { version = "0.1.0", path = "../meshql-core" }
meshql-changes = { version = "0.1.0", path = "../meshql-changes" }
merkql = { workspace = true }
anyhow = "1"
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
handlebars = { workspace = true }
tokio = { workspace = true }
tempfile = "3"
uuid = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
meshql-cert = { version = "0.1.0", path = "../meshql-cert" }
meshql-server = { version = "0.1.0", path = "../meshql-server" }
meshql-graphlette = { version = "0.1.0", path = "../meshql-graphlette" }
meshql-restlette = { version = "0.1.0", path = "../meshql-restlette" }
cucumber = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { workspace = true }
tokio = { workspace = true }
tempfile = "3"

[[test]]
name = "repo_cert"
harness = false

[[test]]
name = "searcher_cert"
harness = false

[[test]]
name = "farm_cert"
harness = false

[[test]]
name = "authz_cert"
harness = false
