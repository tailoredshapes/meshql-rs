[package]
name = "merkql-connect"
version = "0.1.0"
edition = "2021"
description = "merkql-connect — a standalone change-data-capture connector that replicates committed meshql envelope writes from SQLite, MongoDB or PostgreSQL onto a merkql topic"
license = "MIT"
repository = "https://github.com/tailoredshapes/meshql-rs"

[[bin]]
name = "merkql-connect"
path = "src/main.rs"

[dependencies]
meshql-core = { version = "0.1.0", path = "../meshql-core" }
merkql = { workspace = true }
anyhow = "1"
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
futures = "0.3"
toml = "0.8"
fs2 = "0.4"

# Backends. All on by default: a standalone connector binary is normally
# built once and pointed at whichever store a deployment actually runs.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"], optional = true }
notify = { version = "6", optional = true }
meshql-mongo = { version = "0.1.0", path = "../meshql-mongo", optional = true }
mongodb = { version = "3", optional = true }
bson = { version = "2", features = ["chrono-0_4"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
url = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
percent-encoding = { version = "2", optional = true }

# Queue backends. merkql is always available; every other queue is a
# `meshql_core::Repository` reached through `RepositorySink`.
meshql-ksql = { version = "0.1.0", path = "../meshql-ksql", optional = true }

[features]
default = ["sqlite", "mongo", "postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite", "dep:notify"]
postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/chrono"]
mongo = ["dep:mongodb", "dep:bson", "dep:meshql-mongo"]
ksql = ["dep:meshql-ksql"]
# Not in `default`: SAP is an ingress connector reaching out over the network to
# a system the other three never touch, so a deployment opts into it.
sap = ["dep:reqwest", "dep:url", "dep:base64", "dep:percent-encoding"]
# Salesforce is an *ingress* connector to a SaaS, not a store this workspace
# provisions, so it stays out of `default`: a build that never talks to
# Salesforce should not carry an HTTP client it cannot use.
salesforce = ["dep:reqwest"]
# HubSpot CRM ingress. Off by default: it is an ingress connector against a
# third-party SaaS, not one of the meshql envelope stores the default build is
# for.
hubspot = ["dep:reqwest"]

[dev-dependencies]
tempfile = "3"
meshql-mongo = { version = "0.1.0", path = "../meshql-mongo" }
mongodb = "3"
bson = { version = "2", features = ["chrono-0_4"] }
async-trait = { workspace = true }
meshql-sqlite = { version = "0.1.0", path = "../meshql-sqlite" }
meshql-restlette = { version = "0.1.0", path = "../meshql-restlette" }
meshql-merkql = { version = "0.1.0", path = "../meshql-merkql" }
axum = { workspace = true }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"] }
meshql-postgres = { version = "0.1.0", path = "../meshql-postgres" }
wiremock = "0.6"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["mongo", "postgres"] }
uuid = { workspace = true }
# The SAP tests never touch a network: wiremock stands in for the OData service.
# Fakes HubSpot for the `hubspot` tests. Every one of them runs offline.
