scalar Date

# Business event (verb). Immutable; front ends POST these. Queryable for audit.
type Query {
  getById(id: ID, at: Float): EggsTransferred
  getAll(at: Float): [EggsTransferred]
}

type EggsTransferred {
  id: ID
  source_container_id: String!
  dest_container_id: String!
  eggs: Int!
  timestamp: String!
}
