type Hen {
    id: ID
    coopId: String
    name: String
    dateOfBirth: String
    coop: Coop
    layReports: [LayReport]
    productivity: [HenProductivity]
}

type Coop {
    id: ID
    name: String
}

type LayReport {
    id: ID
    eggs: Int
    timeOfDay: String
}

type HenProductivity {
    id: ID
    totalEggs: Int
    lastLaidAt: String
}

type Query {
    getHen(id: ID, at: Float): Hen
    getHens(name: String, at: Float): [Hen]
    getHensByCoop(id: ID, at: Float): [Hen]
}
