[workspace]
members = [
    "meshql-core",
    "meshql-mongo",
    "meshql-graphlette",
    "meshql-restlette",
    "meshql-mcp",
    "meshql-casbin",
    "meshql-server",
    "meshql-cert",
    "meshql-merkql",
    "meshql-merksql",
    "meshql-changes",
    "meshql-sqlite",
    "meshql-postgres",
    "meshql-mysql",
    "examples/farm",
    "examples/egg-economy",
    "examples/egg-economy-sap",
    "examples/egg-economy-salesforce",
    "meshql-lambda",
    "meshql-ksql",
    "examples/egg-economy-lambda",
    "examples/egg-economy-ksql",
    "examples/farm-azure",
]
resolver = "2"

[workspace.dependencies]
merkql = { version = "0.2", git = "https://github.com/tailoredshapes/merkql", tag = "v0.2.0" }
merksql = { version = "0.1", git = "https://github.com/tailoredshapes/merksql", tag = "v0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
handlebars = "6"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
